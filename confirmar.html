<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmar reserva — Mago Kike</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --dorado: #D4AF37;
      --dorado-oscuro: #C9A84C;
      --crema: #FAFAF8;
      --negro: #1a1a1a;
      --gris: #666;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Jost', sans-serif;
      background: var(--crema);
      color: var(--negro);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .mk-brand {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--negro);
      letter-spacing: 0.05em;
      text-decoration: none;
      margin-bottom: 48px;
      display: block;
      text-align: center;
    }
    .mk-brand span { color: var(--dorado); }
    .mk-card {
      background: #fff;
      border: 1px solid rgba(212,175,55,0.25);
      padding: 56px 48px;
      max-width: 460px;
      width: 100%;
      text-align: center;
    }
    .mk-simbolo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      color: var(--dorado);
      letter-spacing: 0.3em;
      margin-bottom: 24px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      font-weight: 600;
      color: var(--negro);
      margin-bottom: 20px;
      line-height: 1.1;
    }
    .mk-divider {
      width: 40px;
      height: 1px;
      background: var(--dorado);
      margin: 0 auto 24px;
    }
    .mk-info {
      font-size: 15px;
      color: var(--gris);
      line-height: 1.8;
      margin-bottom: 32px;
    }
    .mk-info strong { color: var(--negro); font-weight: 500; }
    .mk-detalle {
      border: 1px solid rgba(212,175,55,0.2);
      padding: 16px 20px;
      margin-bottom: 32px;
      text-align: left;
      font-size: 13px;
      color: var(--gris);
      line-height: 2;
    }
    .mk-detalle strong { color: var(--dorado); font-weight: 500; }
    .mk-btn-whatsapp {
      display: block;
      background: #25D366;
      color: #fff;
      font-family: 'Jost', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 15px 32px;
      text-decoration: none;
      width: 100%;
      text-align: center;
      transition: background 0.2s;
    }
    .mk-btn-whatsapp:hover { background: #1ebe5d; color: #fff; }
    .mk-footer {
      margin-top: 48px;
      font-size: 11px;
      color: #bbb;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-align: center;
    }
    .mk-error {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      color: #c0392b;
    }
    .mk-loading {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      color: var(--gris);
      font-style: italic;
    }
    @media (max-width: 480px) {
      .mk-card { padding: 40px 24px; }
    }
  </style>
</head>
<body>

  <a class="mk-brand" href="https://area51kike.github.io/magokike">
    ✦ Mago Kike
  </a>

  <div class="mk-card" id="contenido">
    <p class="mk-loading">Confirmando reserva...</p>
  </div>

  <p class="mk-footer">© 2026 Mago Kike · El Salvador</p>

  <script>
    const SUPABASE_FUNCTION_URL = 'https://lopzmdwdkpebaxvwciwc.supabase.co/functions/v1/confirmar-reserva';
    const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvcHptZHdka3BlYmF4dndjaXdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3MTYzNjEsImV4cCI6MjA5NjI5MjM2MX0.n-KhXSGaMINWxo7yh5HZyNZevA7lCvKV65QhROGopkI';

    function limpiarTelefono(tel) {
      let digits = tel.replace(/\D/g, '');
      if (digits.startsWith('503') && digits.length === 11) return digits;
      if (digits.startsWith('0')) digits = digits.slice(1);
      if (digits.length === 8) return '503' + digits;
      return digits;
    }

    async function confirmar() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const contenido = document.getElementById('contenido');

      if (!id) {
        contenido.innerHTML = '<p class="mk-error">ID de reserva no encontrado.</p>';
        return;
      }

      try {
        const res = await fetch(`${SUPABASE_FUNCTION_URL}?id=${id}`, {
          headers: {
            'Authorization': `Bearer ${ANON_KEY}`,
            'apikey': ANON_KEY
          }
        });
        const data = await res.json();

        if (!res.ok || data.error) {
          contenido.innerHTML = '<p class="mk-error">Esta reserva ya fue confirmada anteriormente.</p>';
          return;
        }

        const { nombre, fecha, hora_inicio, tipo_show, duracion, telefono } = data;
        const [y, m, d] = fecha.split('-');
        const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                       'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
        const fechaFmt = `${d} de ${MESES[parseInt(m)-1]} de ${y}`;
        const tipoFmt = tipo_show === 'cerca' ? 'Magia de cerca' : 'Show escénico';

        const tel = limpiarTelefono(telefono || '');
        const msg = encodeURIComponent(
          `Hola ${nombre}, tu show con Mago Kike esta pre-confirmado!\n\n` +
          `Fecha: ${fechaFmt}\n` +
          `Hora: ${hora_inicio}\n` +
          `Show: ${tipoFmt}\n` +
          `Duracion: ${duracion} minutos\n\n` +
          `Escribeme para coordinar los detalles y confirmar tu fecha.`
        );
        const whatsappURL = `https://wa.me/${tel}?text=${msg}`;

        contenido.innerHTML = `
          <div class="mk-simbolo">✦</div>
          <h1>Reserva confirmada</h1>
          <div class="mk-divider"></div>
          <p class="mk-info">
            La reserva de <strong>${nombre}</strong><br/>
            para el <strong>${fechaFmt}</strong><br/>
            ha sido marcada como confirmada.
          </p>
          <div class="mk-detalle">
            <strong>Show</strong> &nbsp;·&nbsp; ${tipoFmt}<br/>
            <strong>Hora</strong> &nbsp;·&nbsp; ${hora_inicio}<br/>
            <strong>Duración</strong> &nbsp;·&nbsp; ${duracion} minutos
          </div>
          <a href="${whatsappURL}" target="_blank" class="mk-btn-whatsapp">
            Notificar al cliente por WhatsApp
          </a>
        `;

      } catch (err) {
        contenido.innerHTML = '<p class="mk-error">Error de conexión. Intenta de nuevo.</p>';
      }
    }

    confirmar();
  </script>
</body>
</html>
